name: economic-recap-daily

on:
  # external dispatch via cron-job.org (exact-time). GitHub cron removed: it ran 3-4h late and duplicated posts.
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          # 22:10 UTC sharp, right after the earnings daily recap (22:00) and
          # always before the next day's calendar (00:00 UTC).
          target=$(date -u -d "today 22:10 UTC" +%s)
          now=$(date -u +%s)
          [ "$now" -lt "$target" ] && sleep $((target-now)) || true
      - name: Post daily economic recap
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/economic_data.py recap
      # tomorrow's calendar step removed: economic-today posts the day's calendar
      # at 00:00 UTC sharp, so posting it here at 22:10 would duplicate it.
