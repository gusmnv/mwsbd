name: economic-data

on:
  schedule:
    # Sunday 12:00 UTC = 16:00 Dubai — week-ahead economic calendar
    - cron: "47 23 * * 6"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until 00:00 UTC (weekly economic calendar, the moment UTC Sunday starts)
        run: |
          now=$(date -u +%s)
          prev=$(date -u -d "today 00:00 UTC" +%s)
          next=$(date -u -d "tomorrow 00:00 UTC" +%s)
          if [ "$((now-prev))" -lt 3600 ]; then
            echo "Within the first hour after 00:00 UTC - posting now"
          elif [ "$((next-now))" -le 5400 ]; then
            echo "Sleeping $((next-now))s until 00:00 UTC sharp"
            sleep $((next-now))
          else
            echo "Dispatched mid-day - posting now rather than waiting $((next-now))s"
          fi
      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p fonts
          curl -sL -o fonts/IBMPlexSans.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth%2Cwght%5D.ttf"
      - name: Post week-ahead economic calendar
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
        run: python scripts/economic_data.py
