name: economic-recap-weekly

on:
  # external dispatch via cron-job.org (exact-time). GitHub cron removed: it ran 3-4h late and duplicated posts.
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          # 23:59 UTC Saturday - the LAST minute of the UTC week; the new weekly
          # calendar follows at 00:00 Sunday, never in the same minute.
          target=$(date -u -d "today 23:59 UTC" +%s)
          now=$(date -u +%s)
          [ "$now" -lt "$target" ] && sleep $((target-now)) || true
      - name: Post weekly economic recap
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/economic_data.py weekrecap
