name: economic-recap-weekly

on:
  schedule:
    # 01:35 UTC Saturday = 21:35 ET Friday (right after the earnings weekly recap)
    - cron: "57 0 * * 6"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          target=$(date -u -d "today 01:35 UTC" +%s)
          now=$(date -u +%s)
          [ "$now" -lt "$target" ] && sleep $((target-now)) || true
      - name: Post weekly economic recap
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
        run: python scripts/economic_data.py weekrecap
