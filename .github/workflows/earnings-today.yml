name: earnings-today

on:
  # external dispatch via cron-job.org (exact-time). GitHub cron removed: it ran 3-4h late and duplicated posts.
  workflow_dispatch: {}

permissions:
  contents: write   # commits the market-cap cache

concurrency:
  group: earnings-today
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until 00:00 UTC (daily earnings calendar, the moment the UTC day starts)
        run: |
          now=$(date -u +%s)
          prev=$(date -u -d "today 00:00 UTC" +%s)
          next=$(date -u -d "tomorrow 00:00 UTC" +%s)
          if [ "$((now-prev))" -lt 3600 ]; then
            echo "Within the first hour after 00:00 UTC - posting now"
          elif [ "$((next-now))" -le 5400 ]; then
            echo "Sleeping $((next-now))s until 00:00 UTC sharp"
            sleep $((next-now))
          else
            echo "Dispatched mid-day - posting now rather than waiting $((next-now))s"
          fi
      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p fonts
          curl -sL -o fonts/IBMPlexSans.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth%2Cwght%5D.ttf"
      - name: Post today's earnings table
        env:
          DISCORD_WEBHOOK_STOCK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_STOCK_EARNINGS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          MIN_MCAP_B: "5"
        run: python scripts/earnings.py today
      - name: Save market-cap cache
        run: |
          git config user.name  "mrwallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add state/ || true
          git diff --cached --quiet || git commit -m "chore: update mcap cache"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) - rebasing and retrying"
            sleep $((i*5)); git pull --rebase || true
          done   # cache is best-effort: a push race must never fail the run
