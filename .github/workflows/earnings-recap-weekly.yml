name: earnings-recap-weekly

on:
  schedule:
    # 01:30 UTC Saturday = 21:30 ET Friday — 30 min after Friday's daily recap
    - cron: "51 0 * * 6"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          target=$(date -u -d "today 01:30 UTC" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target-now))s until 01:30 UTC sharp"
            sleep $((target-now))
          else
            echo "LATE START: $(( (now-target)/60 )) min after target — posting anyway"
          fi
      - name: Post weekly earnings recap
        env:
          DISCORD_WEBHOOK_STOCK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_STOCK_EARNINGS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/earnings.py weekrecap
