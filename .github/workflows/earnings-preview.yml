name: earnings-preview

on:
  schedule:
    # Sunday 12:05 UTC = 16:05 Dubai — week-ahead earnings calendar
    - cron: "30 11 * * 0"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          target=$(date -u -d "today 12:05 UTC" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target-now))s until 12:05 UTC sharp"
            sleep $((target-now))
          else
            echo "Started after target — posting immediately"
          fi
      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p fonts
          curl -sL -o fonts/IBMPlexSans.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth%2Cwght%5D.ttf"
      - name: Post week-ahead earnings calendar
        env:
          DISCORD_WEBHOOK_STOCK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_STOCK_EARNINGS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/earnings.py preview
