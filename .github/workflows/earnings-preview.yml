name: earnings-preview

on:
  schedule:
    # Sunday 12:05 UTC = 16:05 Dubai — week-ahead earnings calendar
    - cron: "5 12 * * 0"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core
      - name: Post week-ahead earnings calendar
        env:
          DISCORD_WEBHOOK_STOCK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_STOCK_EARNINGS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/earnings.py preview
