name: economic-live

on:
  # external dispatch via cron-job.org (exact-time). GitHub cron removed: it ran 3-4h late and duplicated posts.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: economic-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until session start and size it
        id: cfg
        run: |
          now=$(date -u +%s)
          m=$(date -u -d "today 12:25 UTC" +%s)
          a=$(date -u -d "today 17:55 UTC" +%s)
          TOL=5400   # <=90 min late still joins its own window; later than that, skip
          if   [ "$now" -lt "$m" ] && [ "$((m-now))" -le "$TOL" ]; then target=$m; mins=105
          elif [ "$now" -ge "$m" ] && [ "$now" -lt "$((m+TOL))" ]; then target=$now; mins=105; echo "LATE: joining morning window"
          elif [ "$now" -lt "$a" ] && [ "$((a-now))" -le "$TOL" ]; then target=$a; mins=15
          elif [ "$now" -ge "$a" ] && [ "$now" -lt "$((a+1800))" ]; then target=$now; mins=15; echo "LATE: joining afternoon window"
          elif [ "$now" -lt "$a" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Woken far from any window - skipping rather than sleeping across it"; exit 0
          else echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Too late for any window today - skipping"; exit 0; fi
          [ "$target" -gt "$now" ] && { echo "Sleeping $((target-now))s"; sleep $((target-now)); } || true
          echo "mins=$mins" >> "$GITHUB_OUTPUT"
      - name: Live US economic data watch (BLS/BEA/Fed)
        if: steps.cfg.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          LIVE_MINUTES: ${{ steps.cfg.outputs.mins }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/economic_live.py
      - name: Save captured actuals
        if: always()
        run: |
          git config user.name  "mrwallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add state/ || true
          git diff --cached --quiet || git commit -m "chore: update econ actuals"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) - rebasing and retrying"
            sleep $((i*5)); git pull --rebase || true
          done
