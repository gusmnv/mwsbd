name: economic-live

on:
  schedule:
    # Morning session: starts 12:25 UTC sharp (08:25 ET), 105 min — covers 8:30 & 10:00 releases
    - cron: "47 11 * * 1-5"
    # Afternoon check: starts 17:55 UTC sharp (13:55 ET), 15 min — FOMC days
    - cron: "17 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: economic-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until session start and size it
        id: cfg
        run: |
          now=$(date -u +%s)
          m=$(date -u -d "today 12:25 UTC" +%s)
          a=$(date -u -d "today 17:55 UTC" +%s)
          if [ "$now" -lt "$m" ]; then target=$m; mins=105
          elif [ "$now" -lt "$a" ]; then target=$a; mins=15
          else target=$now; mins=15; fi
          [ "$target" -gt "$now" ] && { echo "Sleeping $((target-now))s"; sleep $((target-now)); } || true
          echo "mins=$mins" >> "$GITHUB_OUTPUT"
      - name: Live US economic data watch (BLS/BEA/Fed)
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          LIVE_MINUTES: ${{ steps.cfg.outputs.mins }}
        run: python scripts/economic_live.py
      - name: Save captured actuals
        if: always()
        run: |
          git config user.name  "mrwallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add state/ || true
          git diff --cached --quiet || git commit -m "chore: update econ actuals"
          git push || true
