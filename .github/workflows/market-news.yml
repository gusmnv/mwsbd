name: market-news

on:
  schedule:
    - cron: "0 12,14,16,18,20,22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post fresh headlines to Discord
        env:
          DISCORD_WEBHOOK_MARKET_NEWS: ${{ secrets.DISCORD_WEBHOOK_MARKET_NEWS }}
        run: python scripts/market_news.py
      - name: Save seen-headlines state
        run: |
          git config user.name  "mrwallstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add state/ || true
          git diff --cached --quiet || git commit -m "chore: update seen news state"
          git push
