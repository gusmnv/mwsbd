name: economic-today

on:
  schedule:
    # 04:05 UTC = 00:05 ET — start of each ET day, Mon-Sat (Sat catches Friday-night Asia)
    - cron: "27 3 * * 1-6"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          target=$(date -u -d "today 04:05 UTC" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target-now))s until 04:05 UTC sharp"
            sleep $((target-now))
          else
            echo "LATE START: $(( (now-target)/60 )) min after target — posting anyway"
          fi
      - name: Post today's economic events
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
        run: python scripts/economic_data.py today
