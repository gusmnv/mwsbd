name: economic-today

on:
  # external dispatch via cron-job.org (exact-time). GitHub cron removed: it ran 3-4h late and duplicated posts.
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until 00:00 UTC (daily economic calendar, the moment the UTC day starts)
        run: |
          now=$(date -u +%s)
          prev=$(date -u -d "today 00:00 UTC" +%s)
          next=$(date -u -d "tomorrow 00:00 UTC" +%s)
          if [ "$((now-prev))" -lt 3600 ]; then
            echo "Within the first hour after 00:00 UTC - posting now"
          elif [ "$((next-now))" -le 5400 ]; then
            echo "Sleeping $((next-now))s until 00:00 UTC sharp"
            sleep $((next-now))
          else
            echo "Dispatched mid-day - posting now rather than waiting $((next-now))s"
          fi
      - name: Post today's economic events
        env:
          DISCORD_WEBHOOK_ECONOMIC_DATA: ${{ secrets.DISCORD_WEBHOOK_ECONOMIC_DATA }}
        run: python scripts/economic_data.py today
