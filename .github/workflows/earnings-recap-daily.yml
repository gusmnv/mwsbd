name: earnings-recap-daily

on:
  # external dispatch via cron-job.org (exact-time). GitHub cron removed: it ran 3-4h late and duplicated posts.
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until exact post time
        run: |
          # 22:00 UTC sharp = 2h after NY close. Recap ALWAYS lands before the
          # next day's calendar (00:00 UTC). HORARIO E CHAVE.
          target=$(date -u -d "today 22:00 UTC" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target-now))s until 22:00 UTC sharp"
            sleep $((target-now))
          else
            echo "LATE START: $(( (now-target)/60 )) min after target — posting anyway"
          fi
      - name: Post daily earnings recap
        env:
          DISCORD_WEBHOOK_STOCK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_STOCK_EARNINGS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/earnings.py recap
